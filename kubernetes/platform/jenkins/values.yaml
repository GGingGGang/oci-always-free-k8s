  installLatestPlugins: false
  initializeOnce: true

  JCasC:
    defaultConfig: true
    configScripts:
      welcome-config: |
        jenkins:
          systemMessage: "Jenkins managed via JCasC. Source of truth = git."
      env-config: |
        jenkins:
          globalNodeProperties:
            - envVars:
                env:
                  - key: GH_ORG
                    value: ${GH_ORG}
      credentials-config: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: github-token
                      username: GGingGGang
                      password: ${GIT_PAT}
                      description: "GitHub PAT (repo scope) — manifest bump push"
      library-config: |
        unclassified:
          globalLibraries:
            libraries:
              - name: "shared"
                defaultVersion: "main"
                implicit: false
                retriever:
                  modernSCM:
                    scm:
                      git:
                        remote: "https://github.com/${GH_ORG}/jenkins-shared-library.git"
      jobs-config: |
        jobs:
          - script: |
              organizationFolder('services') {
                description('Auto-discovered MSA pipelines (svc-*)')
                organizations {
                  github {
                    repoOwner('${GH_ORG}')
                    apiUri('https://api.github.com')
                    credentialsId('github-token')
                    traits {
                      gitHubBranchDiscovery {
                        strategyId(1)
                      }
                      sourceRegexFilter {
                        regex('svc-.*')
                      }
                    }
                  }
                }
                projectFactories {
                  workflowMultiBranchProjectFactory {
                    scriptPath('Jenkinsfile')
                  }
                }
                orphanedItemStrategy {
                  discardOldItems {
                    daysToKeep(-1)
                    numToKeep(-1)
                  }
                }
                triggers {
                  periodicFolderTrigger {
                    interval('15m')
                  }
                }
              }
              queue('services')

persistence:
  enabled: false

agent:
  enabled: true
  containerCap: 2

  image:
    repository: docker.io/jenkins/inbound-agent
    tag: 3395.v6e5377b_0fb_3c-1-jdk21

  resources:
    requests:
      cpu: "0"
      memory: 256Mi
    limits:
      memory: 512Mi

  podTemplates:
    kaniko: |
      - name: kaniko
        label: kaniko
        namespace: build
        serviceAccount: kaniko-builder
        yaml: |
          apiVersion: v1
          kind: Pod
          spec:
            automountServiceAccountToken: false
            imagePullSecrets:
              - name: ghcr-pull
            containers:
              - name: jnlp
                image: docker.io/jenkins/inbound-agent:3395.v6e5377b_0fb_3c-1-jdk21
                resources:
                  requests:
                    cpu: "0"
                    memory: 256Mi
                  limits:
                    memory: 512Mi
              - name: kaniko
                image: gcr.io/kaniko-project/executor:v1.23.2-debug
                command: ["sleep"]
                args: ["99d"]
                resources:
                  requests:
                    cpu: "0"
                    memory: 1Gi
                  limits:
                    memory: 2Gi
                volumeMounts:
                  - name: docker-config
                    mountPath: /kaniko/.docker
              - name: trivy
                image: docker.io/aquasec/trivy:0.72.0
                command: ["sleep"]
                args: ["99d"]
                env:
                  - name: DOCKER_CONFIG
                    value: /trivy/.docker
                  - name: TRIVY_CACHE_ROOT
                    value: /var/cache/trivy
                securityContext:
                  runAsUser: 0
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                    add: ["DAC_OVERRIDE"]
                resources:
                  requests:
                    cpu: "0"
                    memory: 256Mi
                  limits:
                    memory: 512Mi
                volumeMounts:
                  - name: docker-config
                    mountPath: /trivy/.docker
                  - name: trivy-cache
                    mountPath: /var/cache/trivy
              - name: cosign
                image: ghcr.io/ggingggang/cosign:2.4.1
                command: ["sleep"]
                args: ["99d"]
                securityContext:
                  runAsUser: 0
                env:
                  - name: DOCKER_CONFIG
                    value: /cosign/.docker
                  - name: COSIGN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: cosign-key
                        key: password
                resources:
                  requests:
                    cpu: "0"
                    memory: 128Mi
                  limits:
                    memory: 256Mi
                volumeMounts:
                  - name: docker-config
                    mountPath: /cosign/.docker
                  - name: cosign-key
                    mountPath: /cosign/key
                    readOnly: true
            volumes:
              - name: trivy-cache
                hostPath:
                  path: /var/lib/trivy-cache
                  type: DirectoryOrCreate
              - name: docker-config
                projected:
                  sources:
                    - secret:
                        name: ghcr-push
                        items:
                          - key: .dockerconfigjson
                            path: config.json
              - name: cosign-key
                secret:
                  secretName: cosign-key

serviceAccount:
  create: false
  name: jenkins

rbac:
  create: false

prometheus:
  enabled: false
