controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: 2.580.2-jdk21

  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi

  admin:
    username: admin
    existingSecret: jenkins-admin-fixed
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password

  runAsUser: 1000
  fsGroup: 1000

  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  serviceType: ClusterIP
  servicePort: 8080

  jenkinsUrl: "https://jenkins.ggang.cloud/"
  jenkinsAdminEmail: "admin@ggang.cloud"

  numExecutors: 0

  # publishHTML(Trivy report)이 인라인 <style>/<script>를 쓰므로 기본 CSP(default-src 'none')로는 렌더 안 됨.
  # 외부 리소스는 여전히 차단 — trivy html.tpl 자체가 CDN 참조 없음(체크인된 템플릿 확인됨).
  javaOpts: >-
    -Dhudson.model.DirectoryBrowserSupport.CSP="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self'"

  containerEnv:
    - name: GH_ORG
      value: GGingGGang
    - name: GIT_PAT
      valueFrom:
        secretKeyRef:
          name: jenkins-git-pat
          key: token

  installPlugins:
