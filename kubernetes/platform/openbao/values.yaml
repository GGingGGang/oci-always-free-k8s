global:
  namespace: data
  tlsDisable: true

server:
  image:
    registry: quay.io
    repository: openbao/openbao
    tag: "2.6.0"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  dataStorage:
    enabled: false

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nats-js-nats-0
  volumeMounts:
    - name: data
      mountPath: /openbao/data
      subPath: openbao

  extraLabels:
    storage.ggang.cloud/volume: shared-data

  affinity: |
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              storage.ggang.cloud/volume: shared-data
          topologyKey: kubernetes.io/hostname

  statefulSet:
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

  authDelegator:
    enabled: false

  auditStorage:
    enabled: false

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"
        }

        seal "ocikms" {
          key_id              = "<your-kms-key-ocid>"
          crypto_endpoint     = "<your-kms-crypto-endpoint>"
          management_endpoint = "<your-kms-management-endpoint>"
        }

        service_registration "kubernetes" {}

ui:
  enabled: true

injector:
  enabled: false
