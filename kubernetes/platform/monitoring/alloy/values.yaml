fullnameOverride: alloy

crds:
  create: false

controller:
  type: deployment
  replicas: 1
  # 동시에 두 수집기가 같은 로그를 읽지 않도록 교체한다.
  updateStrategy:
    type: Recreate

global:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    fsGroup: 473
    seccompProfile:
      type: RuntimeDefault

rbac:
  create: true
  namespaces: [app, web, auth, core, batch, notify]
  rules:
    - apiGroups: [""]
      resources: [pods]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
  clusterRules: []

serviceAccount:
  name: alloy
  automountServiceAccountToken: true

alloy:
  enableReporting: false
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  configMap:
    content: |
      logging {
        level = "info"
      }

      discovery.kubernetes "apps" {
        role = "pod"
        namespaces {
          names = {{ .Values.rbac.namespaces | toJson }}
        }
      }

      discovery.relabel "apps" {
        targets = discovery.kubernetes.apps.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "service_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(.+)"
          target_label  = "service_name"
        }
      }

      loki.source.kubernetes "apps" {
        targets    = discovery.relabel.apps.output
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        external_labels = {cluster = "oci-always-free-k8s"}
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      otelcol.receiver.otlp "apps" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.memory_limiter.traces.input]
        }
      }

      otelcol.processor.memory_limiter "traces" {
        check_interval = "1s"
        limit = "384MiB"
        spike_limit = "96MiB"
        output {
          traces = [otelcol.processor.batch.traces.input]
        }
      }

      otelcol.processor.batch "traces" {
        timeout = "1s"
        send_batch_size = 256
        send_batch_max_size = 512
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
        sending_queue {
          num_consumers = 2
          queue_size = 128
        }
      }

# 설정 변경은 Deployment의 ConfigMap checksum으로 반영한다.
configReloader:
  enabled: false

service:
  type: ClusterIP

serviceMonitor:
  enabled: false

ingress:
  enabled: false
