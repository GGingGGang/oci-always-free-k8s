deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki-persistent
    replication_factor: 1
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki-persistent/chunks
      rules_directory: /var/loki-persistent/rules
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
    ingestion_rate_mb: 1
    ingestion_burst_size_mb: 2
    max_query_parallelism: 2
    tsdb_max_query_parallelism: 2
  querier:
    max_concurrent: 2
  ingester:
    wal:
      enabled: true
      dir: /var/loki-persistent/wal
      replay_memory_ceiling: 256MB
  compactor:
    working_directory: /var/loki-persistent/compactor
    retention_enabled: true
    delete_request_store: filesystem
  storage_config:
    tsdb_shipper:
      active_index_directory: /var/loki-persistent/index
      cache_location: /var/loki-persistent/index-cache
    bloom_shipper:
      working_directory: /var/loki-persistent/data/bloomshipper
  podSecurityContext:
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  extraVolumes:
    - name: loki-persistent
      persistentVolumeClaim:
        claimName: prometheus-kps-kube-prometheus-stack-prometheus-db-prometheus-kps-kube-prometheus-stack-prometheus-0
  extraVolumeMounts:
    - name: loki-persistent
      mountPath: /var/loki-persistent
      subPath: loki
  nodeSelector:
    storage.ggang.cloud/observability: "true"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

defaults:
  automountServiceAccountToken: false
serviceAccount:
  automountServiceAccountToken: false
rbac:
  namespaced: true

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
memcached:
  enabled: false
sidecar:
  rules:
    enabled: false
ruler:
  enabled: false
minio:
  enabled: false
rollout_operator:
  enabled: false
