prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 45GiB
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 768Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: oci-bv
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
    secrets:
      - discord-webhook
  config:
    route:
      receiver: discord
    # receivers 는 차트 기본과 병합이 아니라 통째 교체 — "null" 은 Watchdog 라우트가 참조하므로 유지 필수
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/discord-webhook/webhook-url

grafana:
  fullnameOverride: grafana
  admin:
    existingSecret: grafana-admin-fixed
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  hostNetwork: false
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
