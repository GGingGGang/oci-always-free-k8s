prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 45GiB
    nodeSelector:
      storage.ggang.cloud/observability: "true"
    securityContext:
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 768Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: oci-bv
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
    # 라우팅/수신처는 AlertmanagerConfig CR(alertmanager-config.yaml) 소유 — 여기에 config: 를 쓰지 말 것
    alertmanagerConfiguration:
      name: alertmanager-global-config
      global:
        resolveTimeout: 5m

grafana:
  # rollback 시 아래 기존 설정을 재사용한다.
  enabled: false
  fullnameOverride: grafana
  admin:
    existingSecret: grafana-admin-fixed
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      memory: 512Mi

prometheus-node-exporter:
  hostNetwork: false
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
