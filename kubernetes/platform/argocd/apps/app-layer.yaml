apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-layer-root
  namespace: cicd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://github.com/GGingGGang/k8s-gitops.git
    targetRevision: main
    path: argocd
    directory:
      recurse: false
      include: "{project.yaml,root.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: cicd
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
